[build-system]
requires = ["uv_build >= 0.9.5, < 0.12"]
build-backend = "uv_build"

[project]
name = "relucent"
description = "Explore the polyhedral complexes of ReLU neural networks."
version = "1.0.1"
requires-python = ">= 3.11"

dependencies = [
    "gurobipy>=12,<14",
    "networkx>=3.0",
    "numpy>=2.0",
    "plotly>=5.20",
    "scipy>=1.13",
    "tqdm>=4.60",
]
authors = [{ name = "Blake B. Gaines" }]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
keywords = [
    "relu",
    "neural networks",
    "polyhedral complex",
    "linear regions",
    "decision boundary",
    "topology",
    "betti numbers",
    "persistent homology",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.optional-dependencies]
torch = ["torch>=2.5.0"]
dev = ["pytest>=9.0.2", "ruff", "basedpyright>=1.39.0"]
docs = ["sphinx>=9.0.4", "sphinx-rtd-theme"]

[project.urls]
Repository = "https://github.com/bl-ake/relucent"
Documentation = "https://bl-ake.github.io/relucent/"
Changelog = "https://github.com/bl-ake/relucent/blob/main/CHANGELOG.md"
Issues = "https://github.com/bl-ake/relucent/issues"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:This process .* is multi-threaded, use of fork\\(\\).*:DeprecationWarning",
]
markers = [
    "requires_c_gf2: needs compiled relucent.topology._gf2 C extension; skipped when unavailable except RELUCENT_REQUIRE_C_GF2=1",
    "python_gf2: pure-Python GF(2) rank path smoke tests (no C required)",
    "integration: large opt-in integration tests; set RELUCENT_RUN_INTEGRATION=1",
]

[tool.ruff]
line-length = 127
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["relucent"]
