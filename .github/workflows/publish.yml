# Build relucent and upload it to PyPI (trusted publishing) when a GitHub release is published.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # The full CI suite must pass on the release commit before anything is built.
  tests:
    uses: ./.github/workflows/python-package.yml

  release-build:
    runs-on: ubuntu-latest
    needs:
      - tests

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check that the release tag is v + the pyproject.toml version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match pyproject.toml version $VERSION (expected v$VERSION)."
            exit 1
          fi

      - name: Build release distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # Required for trusted publishing.
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/relucent

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
