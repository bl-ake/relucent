# See: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Usable

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 0 1 * *"
  # publish.yml runs this suite on the release commit before building.
  workflow_call:

# A new push to a branch or PR cancels its older run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The only job that installs from uv.lock: ruff and basedpyright run at the versions `uv run` gives locally,
  # and Dependabot's lock updates get tested. Every other job resolves fresh, as `pip install relucent` does.
  lint:
    name: Lint, type-check and test (uv.lock)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install the locked environment
      # --locked fails if uv.lock no longer matches pyproject.toml.
      run: |
        python -m pip install uv
        uv sync --locked --python 3.13 --extra dev --extra torch
    - name: Lint with ruff
      run: uv run --no-sync ruff check .
    - name: Check formatting with ruff
      run: uv run --no-sync ruff format --check .
    - name: Type-check with basedpyright
      run: uv run --no-sync basedpyright
    - name: Test with pytest
      env:
        RELUCENT_CAREFUL_MODE: "1"
      run: uv run --no-sync pytest -m "not requires_c_gf2"

  docs:
    name: Docs (warnings are errors)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # torch is needed to render signatures that name torch types; the CPU build is enough.
        python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
        python -m pip install ".[docs]"
    - name: Build Sphinx HTML documentation
      run: sphinx-build -E -n -W --keep-going -b html docs docs/_build/html

  test:
    name: Test (with torch) - ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # Windows takes about 16 minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }} (${{ matrix.os }})
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      # On Linux, PyPI's torch pulls in the CUDA libraries, which these runners can't use, so take the CPU build.
      # (macOS and Windows torch on PyPI is already CPU-only, and the CPU index lags it on macOS.)
      # --torch-backend is a uv preview option.
      run: |
        python -m pip install uv
        uv pip install --system ${{ runner.os == 'Linux' && '--torch-backend cpu' || '' }} ".[dev,torch]"
    - name: Test with pytest
      env:
        RELUCENT_CAREFUL_MODE: "1"
      run: pytest -m "not requires_c_gf2"

  test-lowest-deps:
    name: Test (lowest allowed dependencies) - ubuntu py3.11
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install the oldest versions pyproject.toml allows
      run: |
        python -m pip install uv
        uv pip install --system --resolution lowest-direct .
        uv pip install --system "pytest>=9.0.2"
        uv pip install --system --resolution lowest-direct "torch>=2.5.0" --index-url https://download.pytorch.org/whl/cpu
        uv pip list --system | grep -iE "^(numpy|scipy|networkx|plotly|tqdm|gurobipy|torch) "
    - name: Test with pytest
      env:
        RELUCENT_CAREFUL_MODE: "1"
      run: pytest -m "not requires_c_gf2"

  gf2-backend:
    name: GF(2) C backend + betti_numbers parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install build tools for _gf2_rank.c
      run: sudo apt-get update && sudo apt-get install -y gcc
    - name: Install dependencies
      run: |
        python -m pip install uv
        uv pip install --system --torch-backend cpu ".[dev,torch]"
    - name: Require C backend and run parity tests
      env:
        RELUCENT_CAREFUL_MODE: "1"
        RELUCENT_REQUIRE_C_GF2: "1"
      run: |
        python -c "from relucent.topology import C_BACKEND_AVAILABLE; assert C_BACKEND_AVAILABLE"
        pytest -m requires_c_gf2

  test-no-torch:
    name: Test (no torch) - ubuntu py3.13
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install dependencies (without torch extra)
      run: |
        python -m pip install uv
        uv pip install --system ".[dev]"
    - name: Verify torch is not installed
      run: |
        python - <<'PY'
        import importlib.util
        if importlib.util.find_spec("torch") is not None:
            raise SystemExit("Expected no-torch environment, but torch is installed.")
        print("torch not installed: OK")
        PY
    - name: Run no-torch compatibility checks
      env:
        RELUCENT_CAREFUL_MODE: "1"
      run: pytest tests/test_no_torch.py
