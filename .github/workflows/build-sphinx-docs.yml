name: Deploy Sphinx Docs to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer one waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        # torch is needed to render signatures that name torch types; the CPU build is enough.
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install ".[docs]"

    - name: Build Sphinx HTML documentation
      # Warnings are checked on every push by the Docs job in python-package.yml.
      run: sphinx-build -E -b html docs docs/_build/html

    - name: Upload the site
      uses: actions/upload-pages-artifact@v5
      with:
        path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
